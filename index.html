  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ne-flex;align-items:center;gap:8px;\" style-hover=\"background:var(--accent-strong,#12283f);\">suyixin@hust.edu.cn<\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <section id=\"news\" style=\"scroll-margin-top:60px;background:#f6f5f3;border-top:1px solid #ecebe8;border-bottom:1px solid #ecebe8;\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:clamp(64px,9vh,90px) clamp(20px,5vw,64px);\">\n      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent,#1a3a5c);margin-bottom:14px;\">{{ t.news.kicker }}<\/div>\n      <h2 style=\"font-family:'Newsreader','Noto Serif SC',Georgia,serif;font-size:clamp(30px,4.5vw,46px);font-weight:500;letter-spacing:-.02em;line-height:1.05;margin:0 0 34px;\">{{ t.news.title }}<\/h2>\n      <ol style=\"list-style:none;margin:0;padding:0;\">\n        <sc-for list=\"{{ newsView }}\" as=\"n\" hint-placeholder-count=\"5\">\n          <li style=\"display:grid;grid-template-columns:98px 1fr;gap:22px;padding:17px 0;border-top:1px solid #e2e0dc;align-items:baseline;\">\n            <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;color:var(--accent,#1a3a5c);font-weight:600;letter-spacing:.01em;\">{{ n.date }}<\/span>\n            <span style=\"font-size:15.5px;line-height:1.6;color:#2a2926;\">{{ n.text }}<sc-if value=\"{{ n.hasLink }}\"> <a href=\"{{ n.link }}\" target=\"_blank\" style=\"border-bottom:1px solid var(--accent,#1a3a5c);\">{{ n.linkLabel }}<\/a><\/sc-if><\/span>\n          <\/li>\n        <\/sc-for>\n      <\/ol>\n    <\/div>\n  <\/section>\n\n  <sc-if value=\"{{ showDemo }}\" hint-placeholder-val=\"{{ true }}\">\n  <section id=\"research\" style=\"scroll-margin-top:60px;\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:clamp(70px,10vh,100px) clamp(20px,5vw,64px);\">\n      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;l ubs }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <li style=\"display:grid;grid-template-columns:56px 1fr;gap:20px;padding:22px 0;border-top:1px solid #e2e0dc;\">\n            <span style=\"font-family:'Newsreader',Georgia,serif;font-size:19px;color:#b0ada7;padding-top:2px;\">{{ p.year }}<\/span>\n            <div>\n              <div style=\"font-family:'Newsreader','Noto Serif SC',Georgia,serif;font-size:19px;font-weight:500;line-height:1.32;letter-spacing:-.01em;color:#1c1b1a;margin-bottom:6px;\">{{ p.title }}<\/div>\n              <div style=\"font-size:13.5px;line-height:1.6;color:#6b6864;margin-bottom:9px;\">\n                <sc-for list=\"{{ p.authors }}\" as=\"a\" hint-placeholder-count=\"6\"><span style=\"{{ a.style }}\">{{ a.txt }}<\/span><\/sc-for>\n              <\/div>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;\">\n                <span style=\"font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:14px;color:#3a3936;\">{{ p.venue }}<\/span>\n                <sc-for list=\"{{ p.badges }}\" as=\"b\" hint-placeholder-count=\"1\"><span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;font-weight:600;letter-spacing:.03em;color:var(--accent,#1a3a5c);background:#eef2f6;border:1px solid #d7e0e8;border-radius:5px;padding:3px 8px;\">{{ b }}<\/span><\/sc-for>\n                <sc-for list=\"{{ p.links }}\" as=\"l\" hint-placeholder-count=\"0\"><a href=\"{{ l.url }}\" target=\"_blank\" style=\"font-size:12.5px;font-weight:500;color:var(--accent,#1a3a5c);border-bottom:1px solid #cdd8e2;\" style-hover=\"opacity:.7;\">{{ l.label }}<\/a><\/sc-for>\n              <\/div>\n            <\/div>\n          <\/li>\n        <\/sc-for>\n      <\/ol>\n      <sc-if value=\"{{ noResults }}\"><p style=\"font-size:15px;color:#8a8781;padding:26px 0;border-top:1px solid #e2e0dc;\">{{ t.pubs.empty }}<\/p><\/sc-if>\n    <\/div>\n  <\/section>\n\n  <section id=\"recruit\" style=\"scroll-margin-top:60px;\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:clamp(70px,10vh,100px) clamp(20px,5vw,64px);\">\n      <div style=\"border:1px solid #dbe3ea;border-radius:20px;background:linear-gradient(160deg,#f4f7fa,#f7f6f4);padding:clamp(32px,5vw,60px);position:relative;overflow:hidden;\">\n        <div style=\"position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,#1a3a5c);\"><\/div>\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent,#1a3a5c);margin-bottom:14px;\">{{ t.recruit.kicker }}<\/div>\n        <h2 style=\"font-family:'Newsreader','Noto Serif SC',Georgia,serif;font-size:clamp(28px,4.2vw,44px);font-weight:500;letter-spacing:-.02em;line-height:1.08;margin:0 0 20px;max-width:22ch;\">{{ t.recruit.title }}<\/h2>\n        <p style=\"font-size:16.5px;line-height:1.75;color:#33302e;margin:0 0 28px;max-width:60ch;\">{{ t.recruit.body }}<\/p>\n        <a href=\"mailto:suyixin@hust.edu.cn\" style=\"background:var(--accent,#1a3a5c);color:#fff;padding:12px 22px;border-radius:999px;font-size:14.5px;font-weight:500;display:inline-flex;align-items:center;gap:9px;\" style-hover=\"background:var(--accent-strong,#12283f);\">{{ t.recruit.cta }}<\/a>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <footer style=\"background:#ffffff;\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:44px clamp(20px,5vw,64px);display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:baseline;\">\n      <div style=\"font-size:13px;color:#8a8781;line-height:1.6;\">\n        <span style=\"color:#3a3936;font-weight:500;\">Yixin Su<\/span> · {{ t.footer.affil }}<br>\n        <a href=\"mailto:suyixin@hust.edu.cn\">suyixin@hust.edu.cn<\/a>\n      <\/div>\n      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;color:#a8a5a0;text-align:right;\">{{ t.footer.updated }}<\/div>\n    <\/div>\n  <\/footer>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#1a3a5c&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#7a1f2b&quot;, &quot;#1a3a5c&quot;, &quot;#2f5d4f&quot;, &quot;#333333&quot;], &quot;section&quot;: &quot;Theme&quot;}, &quot;defaultLang&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;en&quot;, &quot;options&quot;: [&quot;en&quot;, &quot;zh&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot;}, &quot;showResearchDemo&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;}, &quot;demoUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;demo.html&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      lang: (props && props.defaultLang) || 'en',\n      filter: 'all',\n      query: '',\n      scrolled: false\n    };\n  }\n\n  T = {\n    en: {\n      nav: { about: 'About', news: 'News', research: 'Research', pubs: 'Publications', recruit: 'Join', teaching: 'Teaching' },\n      hero: {\n        kicker: 'Associate Professor · HUST',\n        name: 'Yixin Su',\n        suffix: '(Ethan)',\n        intro: 'I am an Associate Professor at the School of Computer Science and Technology, Huazhong University of Science and Technology (HUST). My research centers on personalized large language models and recommender systems, with a particular interest in feature-interaction modeling and graph neural networks, alongside interdisciplinary work at the intersection of AI, biology and medicine. Before joining HUST, I worked at Baidu and PayPal on large-scale advertising systems and foundation-model research, and I received my  const filtered = this.pubs.filter(p => {\n      if (f !== 'all' && !(p.topics || []).includes(f)) return false;\n      if (q) {\n        const hay = (p.title + ' ' + p.authors + ' ' + p.venue).toLowerCase();\n        if (!hay.includes(q)) return false;\n      }\n      return true;\n    });\n    const filteredPubs = filtered.map(p => ({\n      year: p.year, title: p.title, venue: p.venue, badges: p.badges, links: p.links,\n      authors: this.tokenize(p.authors)\n    }));\n\n    const filterChips = this.filters.map(fl => {\n      const active = this.state.filter === fl.key;\n      const base = \"border:1px solid;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;\";\n      const style = active\n        ? base + \"background:\" + accent + \";border-color:\" + accent + \";color:#fff;\"\n        : base + \"background:#fff;border-color:#dddad5;color:#6b6864;\";\n      return { key: fl.key, label: lang === 'zh' ? fl.zh : fl.en, style, onClick: () => this.setFilter(fl.key) };\n    });\n\n    const newsView = this.news.map(n => ({\n      date: n.date, text: lang === 'zh' ? n.zh : n.en,\n      link: n.link, hasLink: !!n.link, linkLabel: t.news.link\n    }));\n\n    const total = this.pubs.length;\n    const shown = filtered.length;\n    const countLabel = lang === 'zh'\n      ? (this.state.filter === 'all' && !q ? '共 ' + total + ' 篇' : shown + ' / ' + total + ' 篇')\n      : (this.state.filter === 'all' && !q ? total + ' papers' : shown + ' of ' + total);\n\n    return {\n      t, lang, accent, accentStrong, showDemo,\n      heroName: t.hero.name, heroSuffix: t.hero.suffix,\n      demoUrl, hasDemo, noDemo: !hasDemo,\n      langBtn: lang === 'en' ? '\\u4e2d\\u6587' : 'EN',\n      navBorder: this.state.scrolled ? '#e5e3df' : 'transparent',\n      toggleLang: this.toggleLang,\n      interests: lang === 'zh'\n        ? ['\\u4e2a\\u6027\\u5316\\u5927\\u8bed\\u8a00\\u6a21\\u578b', '\\u63a8\\u8350\\u7cfb\\u7e
